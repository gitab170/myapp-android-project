<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loadstring 変換ツール</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background-color: #e8e8ec;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 28px;
      letter-spacing: -0.5px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #e0e0e0;
      border-radius: 12px;
      font-size: 0.95rem;
      color: #1a1a1a;
      background: #fafafa;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    input[type="text"]:focus {
      border-color: #4a90d9;
      background: #fff;
    }

    input[type="text"]::placeholder {
      color: #bbb;
    }

    .result-label {
      margin-top: 20px;
    }

    .result-box {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f2f2f5;
      font-family: "SF Mono", "Fira Code", "Courier New", monospace;
      font-size: 0.88rem;
      color: #333;
      min-height: 72px;
      line-height: 1.6;
      word-break: break-all;
      white-space: pre-wrap;
      border: 1.5px solid transparent;
      transition: border-color 0.2s;
    }

    .result-box.has-content {
      border-color: #d8e8f8;
      background: #f0f5fb;
      color: #1a3a5c;
    }

    .copy-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      background: #2d2d2d;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
    }

    .copy-btn:hover {
      background: #444;
    }

    .copy-btn:active {
      transform: scale(0.98);
    }

    .copy-btn.copied {
      background: #3a9e6e;
    }

    .hint {
      margin-top: 14px;
      font-size: 0.78rem;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Loadstring 変換ツール</h1>

    <label for="urlInput">URL (raw)</label>
    <input
      type="text"
      id="urlInput"
      placeholder="https://example.com/script.lua"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
    >

    <label class="result-label">変換結果</label>
    <div class="result-box" id="resultBox">loadstring(game:HttpGet(""))()
</div>

    <button class="copy-btn" id="copyBtn">コピー</button>
    <p class="hint">URLを入力すると自動で変換されます</p>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const resultBox = document.getElementById('resultBox');
    const copyBtn = document.getElementById('copyBtn');

    function updateResult() {
      const url = urlInput.value.trim();
      const result = `loadstring(game:HttpGet("${url}"))()`;
      resultBox.textContent = result;
      if (url) {
        resultBox.classList.add('has-content');
      } else {
        resultBox.classList.remove('has-content');
      }
    }

    urlInput.addEventListener('input', updateResult);

    copyBtn.addEventListener('click', () => {
      const text = resultBox.textContent;
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = 'コピーしました ✓';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'コピー';
          copyBtn.classList.remove('copied');
        }, 2000);
      }).catch(() => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        copyBtn.textContent = 'コピーしました ✓';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'コピー';
          copyBtn.classList.remove('copied');
        }, 2000);
      });
    });
  </script>
</body>
</html>
